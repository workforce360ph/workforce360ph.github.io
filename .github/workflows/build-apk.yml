name: Build Workforce360 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Workforce360.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Workforce360-apk
          path: Workforce360.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Workforce360 v1.0.${{ github.run_number }}
          files: Workforce360.apk
          make_latest: true
          body: |
            Download **Workforce360.apk** on your Android phone and open it to install
            (allow "Install unknown apps" for your browser or file manager when asked).
            Demo build with sample data — use "View as" to switch roles.
