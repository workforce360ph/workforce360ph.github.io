<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--brand:#0f766e;--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5e9f2;--green:#16a34a;--blue:#2563eb;--amber:#d97706;--red:#dc2626;--r:14px}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
.grid>*{min-width:0}
.award .person{min-width:0}
.tgt td{vertical-align:top}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 4px}
.tcell{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px}
.tcell .lb{font-size:12px;font-weight:600;margin-bottom:6px;min-height:30px}
.tcell .inp{width:100%;padding:6px 8px}
.tcell label{font-size:11px;color:var(--muted);display:block;margin-top:6px}
.g-tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.g-tg .mini{white-space:normal}
.recard{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px 12px 4px;margin-bottom:10px;background:#f8fafc}
.recard .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0 10px;padding-right:34px}
.recard .full{grid-column:1/-1}
.recard .rdel{position:absolute;top:8px;right:8px}
.kcat{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:#e0f2f1;color:#0f766e;margin-left:4px;white-space:nowrap}
.kdesc{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
.temp{padding:14px 0;border-bottom:1px solid var(--line)}.temp:last-child{border:0}
.tgt .inp{width:96px;padding:6px 8px}
.mini{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.side{position:fixed;inset:0 auto 0 0;width:240px;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.brandbox{padding:20px 18px 14px;display:flex;gap:10px;align-items:center}
.logo{width:38px;height:38px;border-radius:11px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.brandbox b{display:block;color:#fff;font-size:15px}.brandbox small{color:#94a3b8;font-size:11.5px}
.nav{padding:8px 10px;flex:1;overflow:auto}
.nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:#cbd5e1;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500;margin-bottom:2px}
.nav button:hover{background:#1e293b}
.nav button.on{background:var(--brand);color:#fff}
.nav .ic{width:20px;text-align:center}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.sidefoot{padding:14px 18px;font-size:11.5px;color:#64748b;border-top:1px solid #1e293b}
main{margin-left:240px;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:12px 26px;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0;flex:1;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ham{display:none;border:0;background:#fff;border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;box-shadow:0 1px 2px #0001;flex:none}
.who{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px}
.who label{font-size:11px;color:var(--muted)}
.who select{border:0;background:none;font-weight:600;max-width:200px;cursor:pointer}
.bellw{position:relative}
.bell{border:1px solid var(--line);background:#fff;border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer;position:relative}
.bell i{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px}
.bellp{position:absolute;right:0;top:50px;width:350px;max-width:88vw;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px #0002;padding:8px;z-index:50;max-height:70vh;overflow:auto}
.bellp .it{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;cursor:pointer}
.bellp .it:hover{background:#f1f5f9}
.page{padding:22px 26px 70px;max-width:1360px}
.scrim{display:none}
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.span2{grid-column:span 2}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.stat .lb{color:var(--muted);font-size:12px;font-weight:500}
.stat .v{font-size:25px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}
.stat .ico{float:right;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:color-mix(in srgb,var(--brand) 12%,white)}
.mt{margin-top:16px}.mt8{margin-top:8px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.nw{white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-green{background:#dcfce7;color:#15803d}.c-blue{background:#dbeafe;color:#1d4ed8}.c-amber{background:#fef3c7;color:#b45309}.c-red{background:#fee2e2;color:#b91c1c}.c-gray{background:#f1f5f9;color:#475569}.c-purple{background:#ede9fe;color:#6d28d9}.c-teal{background:#ccfbf1;color:#0f766e}
.btn{border:0;background:var(--brand);color:#fff;padding:9px 15px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.amber{background:var(--amber)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.av.lg{width:56px;height:56px;font-size:19px}
.person{display:flex;align-items:center;gap:10px;min-width:170px}
.person b{display:block;font-weight:600}.person small{color:var(--muted);font-size:12px}
.list .person{min-width:0}
.bar{height:8px;background:#eef1f6;border-radius:99px;overflow:hidden;min-width:70px;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.tabs{display:flex;gap:4px;background:#e9edf5;padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:16px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.muted{color:var(--muted)}.small{font-size:12px}
.empty{padding:22px;text-align:center;color:var(--muted)}
.list>div{padding:10px 0;border-bottom:1px solid var(--line)}.list>div:last-child{border-bottom:0}
.clockcard{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#0f172a));color:#fff;border:0}
.clockcard .time{font-size:38px;font-weight:800;letter-spacing:-1px}
.clockcard .btn{background:#fff;color:var(--brand);font-size:15px;padding:11px 20px}
.clockcard .btn.ghost{background:#ffffff22;color:#fff;border:1px solid #ffffff66}
.clockbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{background:#eef1f7;border-radius:var(--r);padding:12px;min-height:200px}
.col h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between}
.task{background:#fff;border-radius:11px;padding:11px 12px;margin-bottom:9px;border:1px solid var(--line)}
.task b{font-weight:600;display:block;margin-bottom:6px}
.task .row{gap:6px}
.goal{display:flex;flex-direction:column;gap:8px}
.rec{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.rec .row{gap:8px}
.rec dl{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;margin:10px 0 0;font-size:13px}
.rec dt{color:var(--muted)}.rec dd{margin:0}
.upd{border-left:2px solid var(--line);padding:4px 0 4px 12px;margin:6px 0 0 4px;font-size:12.5px}
.ladder{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ladder span{background:#f1f5f9;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
.ladder em{color:var(--muted);font-style:normal}
.empcard{cursor:pointer;transition:.15s}.empcard:hover{border-color:var(--brand);transform:translateY(-1px)}
.modal{position:fixed;inset:0;background:#0f172a80;display:none;align-items:flex-start;justify-content:center;z-index:60;padding:40px 14px;overflow:auto}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:16px;width:540px;max-width:100%;box-shadow:0 20px 60px #0004}
.mbox.wide{width:880px}
.mhead{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;flex:1;font-size:16px}
.x{border:0;background:#f1f5f9;width:30px;height:30px;border-radius:8px;font-size:18px;cursor:pointer}
#mform{padding:18px 20px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea,.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff}
.fld textarea{min-height:66px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.f4{grid-template-columns:1fr 1fr}}
.inp{width:auto}
.note{background:color-mix(in srgb,var(--brand) 8%,white);border:1px solid color-mix(in srgb,var(--brand) 25%,white);border-radius:10px;padding:10px 12px;font-size:13px}
.warn{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px 12px;font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:80;font-weight:500;max-width:90vw;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.link{pointer-events:auto;cursor:pointer;padding-right:14px}.toast.link u{color:#5eead4;margin-left:8px;text-decoration:none;font-weight:700}
.annbody{white-space:pre-wrap}.annnew{border-left:4px solid var(--brand)}
.brk{font-size:12px;line-height:1.35;white-space:nowrap}
.pick{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px}.pick label{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:14px;cursor:pointer}
.swatch{width:28px;height:28px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.score{font-weight:800;font-size:15px}
.chartbox{position:relative;height:260px}
.flag{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.flag:last-child{border-bottom:0}
.flag .txt{flex:1;min-width:0}
.tourcard{position:fixed;z-index:90;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,calc(100vw - 24px));background:#fff;border-radius:16px;box-shadow:0 20px 60px #0f172a55;border-top:5px solid var(--brand);padding:16px 18px}
.tourcard .tk{font-size:12px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.5px}.tourcard h4{margin:4px 0 6px;font-size:17px}.tourcard p{margin:0;font-size:14px;color:#334155;line-height:1.5}
.tourcard .dots{display:flex;gap:5px;margin:10px 0}.tourcard .dots i{height:6px;flex:1;border-radius:9px;background:#e2e8f0}.tourcard .dots i.on{background:var(--brand)}
.tourcard.min p,.tourcard.min .dots{display:none}
body.touring main{padding-bottom:240px}
.sigwrap{position:relative;border:2px dashed #cbd5e1;border-radius:12px;height:170px;background:#f8fafc;overflow:hidden}
#sigPad{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sighint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#94a3b8;font-size:13px;pointer-events:none;border-top:1px solid #cbd5e1;margin:0 30px;padding-top:6px}
.sigimg{max-width:240px;width:100%;border:1px solid var(--line,#e2e8f0);border-radius:8px;background:#fff;display:block;margin-bottom:4px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--brand) 0%,#0f172a 100%)}
.login .lbox{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:28px 24px;box-shadow:0 30px 80px #0006}
.login .lbox h2{margin:14px 0 4px;font-size:22px}
.login .inp{width:100%;font-size:16px;padding:12px}
.login .btn{width:100%;justify-content:center;padding:12px;font-size:15px;margin-top:12px}
.login .demoacc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.login .demoacc button{border:1px solid #e2e8f0;background:#f8fafc;border-radius:999px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.ansel{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scope{display:inline-flex;background:#f1f5f9;border-radius:10px;padding:3px;gap:3px}.scope button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}.scope button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px #0002}
.demo{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;cursor:pointer;font-weight:600}
.seg button span{display:block;font-size:22px}
.cam{position:relative;background:#0f172a;border-radius:14px;overflow:hidden;aspect-ratio:4/3;margin:12px 0}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam.qr video{transform:none}
.cam .ring{position:absolute;left:50%;top:47%;width:52%;aspect-ratio:3/4;transform:translate(-50%,-50%);border:3px dashed #ffffffaa;border-radius:50%;transition:.2s}
.cam.qr .ring{border-radius:14px;aspect-ratio:1}
.cam .ring.ok{border:3px solid #22c55e}
.cam .prompt{position:absolute;left:0;right:0;bottom:0;padding:12px;background:linear-gradient(transparent,#000c);color:#fff;font-weight:700;text-align:center;font-size:16px}
.vsteps{display:grid;gap:6px}
.vstep{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.vstep .st{margin-left:auto}
.thumb{width:34px;height:34px;border-radius:9px;object-fit:cover;cursor:pointer;border:1px solid var(--line);vertical-align:middle}
.selfie{width:100%;max-width:320px;border-radius:14px;display:block;margin:0 auto}
.upl{display:block;border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;cursor:pointer;background:#f8fafc;font-weight:600}
.org ul{list-style:none;margin:0 0 0 16px;padding-left:22px;border-left:2px solid var(--line)}
.org>ul{margin:0;padding:0;border:0}
.org li{margin:8px 0;position:relative}
.org ul ul li::before{content:'';position:absolute;left:-22px;top:22px;width:18px;border-top:2px solid var(--line)}
.onode{display:inline-flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.onode:hover{border-color:var(--brand)}
.onode small{display:block;color:var(--muted);font-size:11.5px}
.badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 8px;min-width:104px}
.badge .e{font-size:28px}
.badge b{font-size:12px}
.award{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--brand) 6%,white))}
.award .e{font-size:30px}
.kiosk{text-align:center}
.kiosk svg{width:min(320px,80vw);height:auto}
.kiosk .code{font-size:44px;font-weight:800;letter-spacing:10px;margin:8px 0}
.insight{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.insight:last-child{border:0}
.bandrow{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:1150px){.g6,.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
 .bellp{position:fixed;left:10px;right:10px;top:64px;width:auto;max-width:none;max-height:75vh}
 .g-aw{grid-template-columns:1fr 1fr}
 .mbox .inp{min-width:0}

 .side.open+.scrim{opacity:1;pointer-events:auto}
 main{margin-left:0}.ham{display:block}

}

<body>
<div id="root"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div><div id="tour"></div>
<script>
/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const todayStr=ds(TODAY);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const rel=n=>ds(addDays(TODAY,n));
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const toMin=t=>{if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+m};
const toT=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const fmt12=t=>{if(!t)return'—';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return`${h}:${pad(m)} ${ap}`};

 if(!r){if(hol)return{status:'Holiday',hol};if(isRD(e,dd))return{status:'Rest Day'};if(date===todayStr)return{status:'Not In',shift:sh};return{status:'Absent',shift:sh}}

 const st=toMin(sh.start),en=toMin(sh.end),inM=toMin(r.in);

function clockState(){const u=me(),t=day(u.id,todayStr),sh=shiftOf(u);let btns='',line='';
 const note=t.status==='On Leave'?'You are on approved leave today 🌴':t.status==='Holiday'?`Holiday: ${t.hol.name}`:t.status==='Rest Day'?'Rest day':'';
 if(!t.in){btns=B('📷 Clock In','verify',{k:'in'});line=note?note+' · you can still clock in if scheduled':`${sh.name} shift ${fmt12(sh.start)}–${fmt12(sh.end)} · ${D.settings.grace}-min grace`}
 else if(!t.out){btns=(t.onBreak?B('▶ End break','breakEnd',{},''):B('☕ Start break','breakStart',{},'ghost'))+' '+(t.onBreak?'':B('📷 Clock Out','verify',{k:'out'}));
  line=`In at ${fmt12(t.in)} (${t.mode})${t.late?` · late by ${t.lateMin} min`:' · on time ✅'}${t.brk?` · break ${t.brk} min`:''}`}
 else line=`Done: ${fmt12(t.in)} – ${fmt12(t.out)} · ${t.worked.toFixed(1)} hrs worked${t.ot?` · ${hm(t.ot)} OT`:''}${t.ut?` · ${hm(t.ut)} undertime`:''}`;
 return{t,btns,line}}
function clockBar(){if(TOP.includes(role()))return'';const{btns,line}=clockState();return`<div class="card clockcard clockbar"><div><b>My attendance today</b> · <span class="liveclock"></span><div class="small" style="opacity:.9">${line}</div></div><span class="sp" style="flex:1"></span><div class="row">${btns}${STAFF.includes(role())&&day(S.user,todayStr).out?(eodOf(S.user,'daily',todayStr)?chip('📝 Report submitted','green'):B('📝 Write daily report','eodNew',{k:'daily'})):''}${PROXY_ROLES.includes(role())&&team().length?B('👥 Team clock-in','teamClock',{},'ghost'):''}</div></div>`}

/* QR kiosk */
function qrCode(t,siteId){const m=Math.floor(t/60000);let h=2166136261;const s=(siteId||S.kioskSite||'main')+'|'+m+'|'+D.settings.qrSecret;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return String((h>>>0)%1000000).padStart(6,'0')}
const qrValid=c=>{c=String(c).replace(/\D/g,'');const n=Date.now();const s=sites().find(x=>c===qrCode(n,x.id)||c===qrCode(n-60000,x.id));return s||null};
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)&&loadScript[src])return res();const s=document.createElement('script');s.src=src;s.onload=()=>{loadScript[src]=1;res()};s.onerror=()=>rej(new Error(src));document.head.appendChild(s)})}
function kioskView(){return`<div class="grid g2"><div class="card kiosk"><div class="row" style="justify-content:center;margin-bottom:8px"><select class="inp" data-chg="kioskSite">${sites().map(x=>`<option value="${x.id}" ${x.id===(S.kioskSite||'main')?'selected':''}>🏢 ${esc(x.name)}</option>`).join('')}</select></div><h3 style="justify-content:center">Clock-in QR</h3><div id="kq" class="empty">Loading QR…</div><div class="code" id="kc">------</div><div class="small muted" id="kt"></div></div>
 <div class="card"><h3>How QR clock-in works</h3><div class="list small"><div>1. Open this page on a tablet or monitor at the entrance (Admin/HR/Supervisor login).</div><div>2. Employees tap <b>Clock In</b> on their phone and scan the code — or type the 6 digits.</div><div>3. The code changes every 60 seconds, so a photo of it can't be reused from home.</div><div>4. Each branch has its own code — put one screen at every branch. GPS is still checked against the branch radius.</div><div>Turn on QR mode in <b>Settings → Verification</b>. Current mode: <b>${esc(VMODES[D.settings.verifyMode])}</b>.</div></div></div></div>`}
let kioskMin=-1;
function kioskTick(){const kc=$('#kc');if(!kc)return;const n=Date.now(),m=Math.floor(n/60000);$('#kt').textContent=`Changes in ${60-Math.floor(n/1000)%60}s`;
 if(m===kioskMin)return;kioskMin=m;const code=qrCode(n);kc.textContent=code;
 loadScript('lib/qrcode.js').then(()=>{const q=qrcode(0,'M');q.addData('W360:'+code);q.make();const el=$('#kq');if(el){el.className='';el.innerHTML=q.createSvgTag({cellSize:8,margin:2,scalable:true})}}).catch(()=>{const el=$('#kq');if(el)el.textContent='QR library could not load — employees can type the 6-digit code.'})}

const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
async function download(filename,data,mime='text/csv'){const isText=typeof data==='string';
 if(window.W360Android){try{if(W360Android.saveData){const b64=isText?btoa(unescape(encodeURIComponent('\ufeff'+data))):await blobB64(data);const r=W360Android.saveData(filename,b64,mime);if(r&&!String(r).startsWith('ERR:'))return dlNote(filename,{uri:r,mime,text:isText?data:null});toast(String(r).slice(4)||'Could not save');return}
  if(isText){toast(W360Android.saveFile(filename,'\ufeff'+data));return}}catch(e){}if(isText)copyBox(data);return}
 try{const blob=isText?new Blob(['\ufeff'+data],{type:mime}):data;const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();dlNote(filename,{url,mime,text:isText?data:null})}catch(e){if(isText)copyBox(data);else toast('Download failed')}}
function dlNote(name,o){const x={id:uid(),name,at:new Date(),...o};DLS.unshift(x);if(DLS.length>8)DLS.length=8;toast(`${o.mime==='application/pdf'?'📄':'📊'} Downloaded ${name}`,()=>dlOpen(x.id),'Open');const b=$('.bell i');render()}
function dlOpen(id){const x=DLS.find(d=>d.id===id);if(!x)return;S.bell=false;
 if(x.uri&&window.W360Android&&W360Android.openUri){const r=W360Android.openUri(x.uri,x.mime);if(r!=='ok'){if(x.text)csvView(x);else toast(r)}return}
 if(x.mime==='application/pdf'){const w=window.open(x.url,'_blank');if(!w)location.href=x.url;return}
 if(x.text)return csvView(x);window.open(x.url,'_blank')}
function csvView(x){const rows=x.text.split('\n').map(l=>{const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch=='"'&&l[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','){o.push(c);c=''}else c+=ch}o.push(c);return o});
 openModal('📊 '+esc(x.name),`<div class="small muted" style="margin-bottom:8px">Saved to your Downloads. Preview (first 60 rows):</div><div class="tbl"><table>${rows.slice(0,61).map((r,i)=>`<tr>${r.map(c=>i?`<td class="small">${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>`,{wide:true})}
function copyBox(text){openModal('Copy report',`<div class="small muted" style="margin-bottom:8px">Downloads are blocked here — copy this and paste into Excel or Google Sheets.</div><textarea class="inp" style="width:100%;min-height:260px" readonly>${esc(text)}</textarea>`)}

function loadFace(){if(faceReady)return faceReady;faceReady=loadScript('lib/face-api.js').then(()=>window.FACE_MODELS?0:loadScript('lib/face-models.js')).then(()=>{const ld=(net,m)=>{const bin=atob(m.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);net.loadFromWeightMap(faceapi.tf.io.decodeWeights(u.buffer,m.specs))};ld(faceapi.nets.tinyFaceDetector,FACE_MODELS.tiny);ld(faceapi.nets.faceLandmark68Net,FACE_MODELS.lm)}).catch(e=>{faceReady=null;throw e});return faceReady}
function nearestSite(g,list){let best=null;(list||sites()).forEach(s=>{const d=hav(g.lat,g.lng,+s.lat,+s.lng);if(!best||d<best.d)best={s,d}});return best}
function siteCheck(e,g){const tol=Math.min(g.acc||0,50);const ok=allowedSites(e);const a=nearestSite(g,ok);
 if(a&&a.d<=(+a.s.radius)+tol)return{fence:'in',site:a.s.name,siteId:a.s.id,dist:a.d};
 const any=nearestSite(g);if(any&&any.d<=(+any.s.radius)+tol)return{fence:'other',site:any.s.name,siteId:any.s.id,dist:any.d};
 return{fence:'out',site:a.s.name,siteId:a.s.id,dist:a.d}}
const hav=(a,b,c,d)=>{const R=6371000,t=x=>x*Math.PI/180;const dl=t(c-a),dn=t(d-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)))};
const fmtDist=m=>m>=1000?(m/1000).toFixed(1)+' km':m+' m';
function getGPS(){return new Promise(res=>{if(!navigator.geolocation)return res({err:'Not supported on this device'});let done=false;const fin=v=>{if(!done){done=true;res(v)}};setTimeout(()=>fin({err:'Timed out'}),15000);
 try{navigator.geolocation.getCurrentPosition(p=>fin({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),e=>fin({err:e.code===1?'Location permission denied':'Location unavailable'}),{enableHighAccuracy:true,timeout:14000,maximumAge:0})}catch(e){fin({err:'Location blocked'})}})}

 resetAsk:()=>openModal('Reset demo data?','<p>This replaces everything with the original sample data.</p>',{submit:'Reset',fn:()=>{D=seed();migrateSites();D.rolesV=2;migrateAccess();migrateShifts();migrateOwner();migrateMisc();migrateKpi();seedTargets();migrateEod();S.user='e1';S.view='';toast('Demo data restored')}})
};
let EVP=null;
function updSugg(){const f=$('#mform');if(!f||!$('#sugg'))return;const s=suggestNext(f.emp.value,f.issue.value);$('#sugg').innerHTML=`💡 Suggested next step: <b>${esc(s.next)}</b> <span class="muted">(${s.prior} prior record${s.prior===1?'':'s'} on this issue in 180 days)</span>`;if(f.issue.value==='Excellent Work')f.type.value='Commendation';else if(f.issue.value==='Development')f.type.value='Coaching';else if(ACC_TYPES.includes(s.next))f.type.value=s.next}

document.addEventListener('click',e=>{if(S.bell&&!e.target.closest('.bellw')){S.bell=false;render();return}const a=e.target.closest('[data-act]');if(!a)return;const fn=ACT[a.dataset.act];if(fn){e.preventDefault();fn(a.dataset,a)}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('change',e=>{
 if(e.target.id==='evIn'){const file=e.target.files[0];if(!file)return;const img=new Image();img.onload=()=>{EVP=snap(img,false);$('#evPrev').innerHTML=`<img class="selfie mt8" src="${EVP}">`};img.src=URL.createObjectURL(file);return}
 const c=e.target.dataset.chg;if(!c)return;
 if(c==='annAll'){if(e.target.checked)document.querySelectorAll('#mform [data-chg=annDep]').forEach(x=>x.checked=false);return}
 if(c==='annDep'){if(e.target.checked)document.querySelector('#mform [name=all]').checked=false;return}
 if(c==='lcDep'){ACT.leaveCredits({dep:e.target.value});return}
 if(c==='payCut'){S.payCut=e.target.value;render();return}
 if(c==='eodDate'){S.eodDate=e.target.value;render();return}
 if(c==='eodWeek'){S.eodWeek=e.target.value;render();return}
 if(c==='pickScope'){const v=e.target.value;document.querySelectorAll('#mform .pick input').forEach(x=>x.checked=v==='all'||(v.startsWith('dept:')&&x.dataset.dept===v.slice(5))||(v.startsWith('site:')&&x.dataset.site===v.slice(5)));return}
 if(c==='anF'){const k=e.target.dataset.k;S[k]=k==='repDays'?+e.target.value:e.target.value;render();return}
 if(c==='role'){if(D.settings.demoSwitch===false)return;S.user=e.target.value;S.tabs={};S.taskEmp='all';S.view='';S.bell=false;save();render();toast('Now viewing as '+me().name+' ('+ROLES[role()]+')')}
 else if(c==='attSite'){S.attSite=e.target.value;render()}
 else if(c==='kioskSite'){S.kioskSite=e.target.value;kioskMin=-1;kioskTick()}
 else if(c==='tgtD'){S.tgtD=e.target.value||todayStr;render()}
 else if(c==='attDate'){S.attDate=e.target.value||todayStr;render()}
 else if(c==='taskEmp'){S.taskEmp=e.target.value;render()}
 else if(c==='repDays'){S.repDays=+e.target.value;render()}
 else if(c==='sugg')updSugg()});
document.addEventListener('input',e=>{const k=e.target.dataset.inp;if(!k)return;const q=e.target.value.toLowerCase();
 if(k==='empSearch')document.querySelectorAll('#empGrid .empcard').forEach(c=>c.style.display=c.dataset.q.includes(q)?'':'none');
 if(k==='auditQ')document.querySelectorAll('#audT tr[data-q]').forEach(r=>r.style.display=r.dataset.q.includes(q)?'':'none')});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='loginF'){loginSubmit(e.target);return}
 if(e.target.id==='mform'){const f=Object.fromEntries(new FormData(e.target));if(onSub&&onSub(f)!==false){if(onSub)closeModal();save();render()}}
 else if(e.target.id==='tgtform'){const key=S.tgtP==='day'?S.tgtD:wkStart(S.tgtD);const store=S.tgtP==='day'?D.dtarget:D.wtarget;let n=0;
  e.target.querySelectorAll('input[name]').forEach(inp=>{const[kind,id,i]=inp.name.split('|');const m=metricsOf(id)[+i];if(!m)return;const k=id+'|'+key;
   if(kind==='t'){const o=store[k]||{};if(inp.value==='')delete o[m.name];else{o[m.name]=+inp.value;n++}store[k]=o}
   else if(kind==='a'){const o=D.daily[k]||{};if(inp.value==='')delete o[m.name];else o[m.name]=+inp.value;D.daily[k]=o}});
  log('Targets',`Saved ${S.tgtP==='day'?'daily':'weekly'} targets for ${key} (${n} values)`);save();render();toast('Targets saved ✅')}
 else if(e.target.id==='setform'){const f=Object.fromEntries(new FormData(e.target));const s=D.settings;
  if(f.band0!=null){const b=[0,1,2,3].map(i=>+f['band'+i]);[0,1,2,3].forEach(i=>delete f['band'+i]);if(!(b[0]>b[1]&&b[1]>b[2]&&b[2]>b[3])){toast('Band thresholds must go from highest to lowest');return false}s.bands=b}
  Object.assign(s,f,{strict:f.strict==='on',alMissed:f.alMissed==='on',alApprovals:f.alApprovals==='on',alTargets:f.alTargets==='on',alOverdue:f.alOverdue==='on',demoSwitch:f.demoSwitch==='on'});applyBands();['lat','lng','radius','grace','otMin','wAtt','wKpi','wTask','vl','sl','retention'].forEach(k=>{if(f[k]!==undefined)s[k]=+f[k]});
  log('Settings','Updated settings');save();render();toast('Settings saved')}});
if(!D.tgtSeeded)seedTargets();
if(D.eodV!==2){migrateEod();save()}
applyBands();
if(/[?&]tour=1/.test(location.search)&&D.settings.demoSwitch!==false){TOUR={i:0};TOURS[0].go();save()}
render();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.W360Android&&!/claude|artifact/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
